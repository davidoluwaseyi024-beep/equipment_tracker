<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Equipment Tracker{% endblock %}</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #1f2937; }
        .navbar { background: #0f172a; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: white; text-decoration: none; margin-right: 16px; font-weight: 600; }
        .nav-links a:hover { text-decoration: underline; }
        .container { max-width: 1200px; margin: 30px auto; padding: 24px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-success { background: #16a34a; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #e2e8f0; }
        tr:nth-child(even) { background: #f9fafb; }
        .badge-red { color: #b91c1c; font-weight: bold; }
        .badge-orange { color: #b45309; font-weight: bold; }
        .badge-green { color: #15803d; font-weight: bold; }
        .login-box { max-width: 420px; margin: 80px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        input { width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div><strong>Equipment Tracker</strong></div>
        <div class="nav-links">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'equipment_list' %}">Equipment</a>
            <a href="{% url 'overdue' %}">Overdue</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}

        {% block contact %}
        contact us on @ 0810000000
        {% endblock %}

        {% block summary %}
        <h1>SUMMARY</h1>
        {% endblock %}
    </div>
</body>
</html>
